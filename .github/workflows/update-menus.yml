name: Update menus

on:
  schedule:
    # GitHub cron uses UTC. Separate expressions let us identify the intended
    # local run even when GitHub starts the scheduled workflow late.
    # 07:00 Europe/Berlin: 05:00 UTC in CEST, 06:00 UTC in CET.
    # 10:00 Europe/Berlin: 08:00 UTC in CEST, 09:00 UTC in CET.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-menus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Select the 07:00 and 10:00 Europe/Berlin runs
        id: local-time
        if: ${{ github.event_name == 'schedule' }}
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset="$(TZ=Europe/Berlin date +%z)"
          case "$offset:$SCHEDULE" in
            "+0200:0 5 * * *"|"+0100:0 6 * * *"|"+0200:0 8 * * *"|"+0100:0 9 * * *")
              echo "run_import=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled import selected (Europe/Berlin UTC offset: $offset)."
              ;;
            *)
              echo "run_import=false" >> "$GITHUB_OUTPUT"
              echo "This UTC schedule does not correspond to 07:00 or 10:00 Europe/Berlin (offset: $offset); skipping."
              ;;
          esac

      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'workflow_dispatch' || steps.local-time.outputs.run_import == 'true' }}
        with:
          ref: main

      - uses: actions/setup-java@v4
        if: ${{ github.event_name == 'workflow_dispatch' || steps.local-time.outputs.run_import == 'true' }}
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: importer/pom.xml

      - name: Run importer tests
        if: ${{ github.event_name == 'workflow_dispatch' || steps.local-time.outputs.run_import == 'true' }}
        run: mvn -B -f importer/pom.xml test

      - name: Run all menu imports
        if: ${{ github.event_name == 'workflow_dispatch' || steps.local-time.outputs.run_import == 'true' }}
        run: |
          mvn -B -f importer/pom.xml -DskipTests compile org.codehaus.mojo:exec-maven-plugin:3.5.0:java \
            '-Dexec.mainClass=de.passau.speisekarten.PassauSpeisekartenApplication' \
            '-Dexec.args=import-all'

      - name: Commit generated JSON when changed
        if: ${{ github.event_name == 'workflow_dispatch' || steps.local-time.outputs.run_import == 'true' }}
        run: |
          if [[ -z "$(git status --porcelain -- frontend/*.json)" ]]; then
            echo "No generated data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/*.json
          git commit -m "data: refresh menu exports"
          git push origin HEAD:main
